name: Build arm64 deb

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install arm64 deps
        run: |
          sudo dpkg --add-architecture arm64
          sudo rm -rf /etc/apt/sources.list /etc/apt/sources.list.d/*.list
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt update
          sudo apt install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libgtk-3-dev:arm64 libwebkit2gtk-4.0-dev:arm64 \
            libjavascriptcoregtk-4.0-dev:arm64 \
            libappindicator3-dev:arm64 librsvg2-dev:arm64 \
            libssl-dev:arm64 libsoup2.4-dev:arm64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Zig (pre-built binary, ~5 sec)
        run: |
          sudo mkdir -p /usr/local/lib/zig
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            | sudo tar xJ -C /usr/local/lib/zig --strip-components=1
          sudo ln -sf /usr/local/lib/zig/zig /usr/local/bin/zig
          zig version

      - name: Build frontend
        run: |
          npm install
          npm run build

      - name: Cross-compile Rust (Zig linker, target GLIBC 2.31)
        run: |
          # Write Zig linker wrapper (printf avoids YAML heredoc indent issue)
          printf '#!/bin/bash\nexec zig cc -target aarch64-linux-gnu.2.31 "$@"\n' \
            > /tmp/zig-linker.sh
          chmod +x /tmp/zig-linker.sh

          cd src-tauri
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "/tmp/zig-linker.sh"\n' \
            > .cargo/config.toml

          PKG_CONFIG_ALLOW_CROSS=1 \
          PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig \
          cargo build --target aarch64-unknown-linux-gnu --release \
            --features custom-protocol

      - name: Debug — list release dir
        run: ls -la src-tauri/target/aarch64-unknown-linux-gnu/release/

      - name: Package deb
        run: |
          chmod +x ci/package-deb.sh
          bash ci/package-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: selftest-arm64-deb
          path: selftest_*.deb
