name: Build arm64 deb

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install arm64 deps
        run: |
          sudo dpkg --add-architecture arm64
          sudo rm -rf /etc/apt/sources.list /etc/apt/sources.list.d/*.list
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt update
          sudo apt install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libgtk-3-dev:arm64 libwebkit2gtk-4.0-dev:arm64 \
            libjavascriptcoregtk-4.0-dev:arm64 \
            libappindicator3-dev:arm64 librsvg2-dev:arm64 \
            libssl-dev:arm64 libsoup2.4-dev:arm64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Build frontend
        run: |
          npm install
          npm run build

      - name: Cross-compile Rust
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"' > .cargo/config.toml
          cd src-tauri
          PKG_CONFIG_ALLOW_CROSS=1 \
          PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig \
          cargo build --target aarch64-unknown-linux-gnu --release

      - name: Package deb
        run: |
          set -euo pipefail

          # === 1. 从 tauri.conf.json 读取版本号 ===
          VERSION=$(jq -r '.package.version' src-tauri/tauri.conf.json)
          PKG_NAME="selftest"
          ARCH="arm64"
          PKG_DIR="${PKG_NAME}_${VERSION}_${ARCH}"
          BINARY="SelfTest"
          BINARY_PATH="src-tauri/target/aarch64-unknown-linux-gnu/release/${BINARY}"

          echo "版本: ${VERSION}"
          echo "包目录: ${PKG_DIR}"
          echo "二进制: ${BINARY_PATH}"

          # === 2. 校验二进制存在且可执行 ===
          if [ ! -f "${BINARY_PATH}" ]; then
            echo "❌ 二进制文件未找到: ${BINARY_PATH}"
            ls -la src-tauri/target/aarch64-unknown-linux-gnu/release/
            exit 1
          fi
          if [ ! -x "${BINARY_PATH}" ]; then
            echo "❌ 二进制文件不可执行: ${BINARY_PATH}"
            exit 1
          fi

          # === 3. 清理旧的构建目录 ===
          rm -rf "${PKG_DIR}"

          # === 4. 创建目录结构 ===
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/local/bin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/128x128/apps"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/32x32/apps"
          mkdir -p "${PKG_DIR}/usr/share/doc/${PKG_NAME}"

          # === 5. 复制二进制 + 设置权限 ===
          install -Dm 755 "${BINARY_PATH}" "${PKG_DIR}/usr/local/bin/${PKG_NAME}"

          # === 6. 复制图标 ===
          if [ -f "src-tauri/icons/128x128.png" ]; then
            install -Dm 644 src-tauri/icons/128x128.png \
              "${PKG_DIR}/usr/share/icons/hicolor/128x128/apps/${PKG_NAME}.png"
          fi
          if [ -f "src-tauri/icons/32x32.png" ]; then
            install -Dm 644 src-tauri/icons/32x32.png \
              "${PKG_DIR}/usr/share/icons/hicolor/32x32/apps/${PKG_NAME}.png"
          fi

          # === 7. 生成 .desktop 文件 ===
          cat > "${PKG_DIR}/usr/share/applications/${PKG_NAME}.desktop" << DESKTOP_EOF
[Desktop Entry]
Type=Application
Name=SelfTest
Name[zh_CN]=刷题助手
GenericName=Quiz Practice Tool
Comment=刷题助手 - Quiz practice app
Exec=${PKG_NAME}
Icon=${PKG_NAME}
Terminal=false
Categories=Education;Utility;
DESKTOP_EOF

          # === 8. 生成 maintainer 脚本 ===
          # postinst: 安装后更新 desktop db 和 icon cache
          cat > "${PKG_DIR}/DEBIAN/postinst" << 'POSTINST'
#!/bin/sh
set -e

# Update desktop database if available
if command -v update-desktop-database >/dev/null 2>&1; then
    update-desktop-database /usr/share/applications 2>/dev/null || true
fi

# Update icon cache if available
if command -v gtk-update-icon-cache >/dev/null 2>&1; then
    gtk-update-icon-cache /usr/share/icons/hicolor 2>/dev/null || true
fi

# Update mime database if available
if command -v update-mime-database >/dev/null 2>&1; then
    update-mime-database /usr/share/mime 2>/dev/null || true
fi

exit 0
POSTINST
          chmod 755 "${PKG_DIR}/DEBIAN/postinst"

          # prerm: 卸载前清理
          cat > "${PKG_DIR}/DEBIAN/prerm" << 'PRERM'
#!/bin/sh
set -e

exit 0
PRERM
          chmod 755 "${PKG_DIR}/DEBIAN/prerm"

          # postrm: 卸载后清理
          cat > "${PKG_DIR}/DEBIAN/postrm" << 'POSTRM'
#!/bin/sh
set -e

if [ "$1" = "purge" ]; then
    # Remove our desktop entry and icons on purge
    if command -v update-desktop-database >/dev/null 2>&1; then
        update-desktop-database /usr/share/applications 2>/dev/null || true
    fi
    if command -v gtk-update-icon-cache >/dev/null 2>&1; then
        gtk-update-icon-cache /usr/share/icons/hicolor 2>/dev/null || true
    fi
fi

exit 0
POSTRM
          chmod 755 "${PKG_DIR}/DEBIAN/postrm"

          # === 9. 生成 control 文件 ===
          cat > "${PKG_DIR}/DEBIAN/control" << CONTROL
Package: ${PKG_NAME}
Version: ${VERSION}
Architecture: ${ARCH}
Maintainer: oneline <oneline@example.com>
Depends: libwebkit2gtk-4.0-37, libgtk-3-0, libappindicator3-1
Section: education
Priority: optional
Description: SelfTest - Quiz practice app
 刷题助手是一款基于 Tauri 的刷题练习应用。
 支持题库管理、练习模式、模拟考试等功能。
CONTROL

          # === 10. 生成 copyright 文件 ===
          cat > "${PKG_DIR}/usr/share/doc/${PKG_NAME}/copyright" << COPYRIGHT
Copyright $(date +%Y) oneline
License: MIT
COPYRIGHT

          # === 11. 生成 changelog 文件 ===
          cat > "${PKG_DIR}/usr/share/doc/${PKG_NAME}/changelog" << CHANGELOG
${PKG_NAME} (${VERSION}) unstable; urgency=medium

  * Initial release

 -- oneline <oneline@example.com>  $(date -R)
CHANGELOG
          gzip -9 -n "${PKG_DIR}/usr/share/doc/${PKG_NAME}/changelog"

          # === 12. 构建 deb 包 ===
          echo "=== 构建 deb 包 ==="
          dpkg-deb --build "${PKG_DIR}"

          # === 13. 验证 deb 包 ===
          echo "=== 包信息 ==="
          dpkg-deb --info "${PKG_DIR}.deb"
          echo "=== 包内容 ==="
          dpkg-deb --contents "${PKG_DIR}.deb" | head -30

          echo "✅ 打包完成: ${PKG_DIR}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: selftest-arm64-deb
          path: selftest_*.deb
